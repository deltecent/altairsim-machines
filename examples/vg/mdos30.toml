# Micropolis MDOS 3.0 on the built-in vgmz machine, with MDOS30-VGMZ-48K.DSK in drive 0.
#
#     altairsim mdos30.toml
#     *                          <- the Monitor 2.0C prompt; press B to boot drive 0

[machine]
name    = "mdos30"
base    = "vgmz"

[[board]]
id = "mdc0"

  [[board.drive]]
  unit  = 0
  mount = "MDOS30-VGMZ-48K.DSK"
