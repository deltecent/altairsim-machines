# RAIDERS on a Processor Technology Sol-20 -- boots SOLOS, loads the game off the cassette,
# and starts it. Just:
#
#     cd examples/sol-20 && altairsim raiders.toml
#
# and RAIDERS comes up. On a real Sol-20 you would type `XE RAID` at the SOLOS prompt; the
# `TYPE` line below does that for you (see README.md). This tape also needs a jump put at
# address 0 first -- its header names the wrong start address; `startup` below explains.
#
# THE NAME IS `RAID`: SOLOS file names are five characters at most. The tape is RAIDERS.WAV
# -- a Sol-20 cassette digitized by Philip Lord (hosted on deramp.com), real 1200-baud CUTS
# audio, which the simulator's demodulator reads directly. It loads in a second or two: the
# cassette carries its own clock and the default is full speed, not the ~40 s a real
# recorder took. `SET sol0:tape1 rate=real` buys back the authentic wait.
#
# `base = "sol20"` IS THE MACHINE -- the Sol-PC's three boards (front panel, VDM-1 video at
# 0CC00H, the composite `sol` I/O board at 0F8H-0FEH), 48K of RAM and SOLOS 1.3 in ROM. See
# built-in `sol20` machine. This file adds a tape, the launch keystrokes, and the clock.

[machine]
name = "raiders"
base = "sol20"

# PUT THE TAPE IN, TYPE THE COMMAND, BOOT. `startup` runs monitor commands in order:
#   1. MOUNT the cassette in deck 1 -- PLAY is pressed; the deck plays only while SOLOS
#      turns the motor (OUT 0FAH), which it does when you ask it to read.
#   2. TYPE queues `XE RAID` and a carriage return at the console -- type-ahead SOLOS reads
#      at its first prompt. The backslash DOUBLES in a TOML (`\\r`): the config parser
#      keeps one for the command.
#   3. DEPOSIT 0000 C3 00 01 puts `JMP 0100` at address 0. THIS TAPE NEEDS IT. A SOLOS
#      tape header carries a load address and an execute address, and `XE` jumps to the
#      execute address when the load ends. This recording's header says: load 0100, size
#      1025, EXECUTE 0000 -- but nothing on the tape loads at 0000, and RAM there holds
#      whatever it powered up with. Without the jump, `XE RAID` loads the game perfectly
#      and then runs garbage; SOLOS comes back with a bare `>` and no game. With it, the
#      jump to 0000 lands on the game's real entry point at 0100.
#      By hand you would do it in two commands instead -- `GE RAID` to load, then
#      `EX 100` to run. That cannot be queued here: SOLOS watches the keyboard while it
#      reads the tape, and keys typed ahead of the second prompt are lost in the load.
#   4. SET vdm0 cursor=steady throws the VDM-1's SW3/SW4 to a non-blinking cursor. Bit 7
#      of a screen byte is the cursor bit, and in the card's default blink mode every
#      cell that has it set flashes on the ~1 Hz oscillator. Steady keeps the game's
#      display still.
#   5. RUN C000 cold-starts SOLOS, which signs on, reads the queued `XE RAID`, and loads.
# REW sol0:tape1 rewinds it -- your finger on the recorder if you `XE RAID` twice. The
# jump at 0000 is still there for the second run unless the game or a POWER cycle has
# overwritten it; `GE RAID` then `EX 100` always works.
startup = [
  "MOUNT sol0:tape1 \"RAIDERS.WAV\"",
  "TYPE \"XE RAID\\r\"",
  "DEPOSIT 0000 C3 00 01",
  "SET vdm0 cursor=steady",
  "RUN C000",
]

# 2.045 MHz -- THE STOCK SOL-20 (14.31818 MHz / 7; Sol Systems Manual, Theory of
# Operation VIII). This is a GAME: it was played at this speed, so it PLAYS authentically.
# The tape has its own clock and loads at full speed regardless. `SET cpu0 clock_hz=0`
# puts it back to flat out.
[[board]]
id       = "cpu0"
clock_hz = 2045000

# THE PERIOD LOOK. A Sol-20's VDM-1 drove a small CRT: a short, wide raster stretched to a
# 4:3 tube, with a scan line between the rows -- not the crisp square pixels of a modern
# panel. `crt = true` paints it that way, which suits this game. `SET DISPLAY crt=off` in the
# monitor gives the sharp look back at any time (or delete this table to default to it).
[display]
focus = on
crt = true
