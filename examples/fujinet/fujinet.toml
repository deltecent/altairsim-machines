# Altair CP/M 2.2b with a FujiNet RS232 adapter on the second serial channel.
#
#     altairsim fujinet.toml
#     -> 56K CP/M 2.2b at the A> prompt. When the FujiNet WiFi is up, type:
#        FUJIDIR N1:TNFS://<server>/*.COM
#
# The FujiNet is a small WiFi adapter that plugs into a serial port. FUJIGET, FUJIPUT, FUJIDIR
# and WGET (FUJINET.DSK, drive A:) copy files and list directories over its network device.
# They are by trgeuy. The source, the manual for the tools and the bring-up notes for a real
# adapter are at https://github.com/trgeuy/fujinet-cpm22
#
# WHERE THE FUJINET IS. The 88-2SIO at port 10H has two serial channels. Channel A (10H/11H)
# is the console. Channel B (12H/13H) is the FujiNet, where the tools expect it. This file
# sets channel B to 76800 baud, so FUJIDIR and the other tools reach the adapter with no setup
# in CP/M.
#
# NAME YOUR SERIAL DEVICE. The `connect` line near the end is a comment. Do one of these:
#
#   - Remove the "#" at the start of the line and put your device name in it.
#   - Leave the file as it is and give the name on the command line with --set:
#
#     altairsim fujinet.toml --set "sio0:b connect=serial:/dev/cu.usbserial-AL009KFH"
#
# The name depends on your computer:
#
#     macOS    serial:/dev/cu.usbserial-XXXXXXXX     (use cu., not tty.)
#     Linux    serial:/dev/ttyUSB0                   (or /dev/ttyACM0; add your user to
#                                                    the `dialout` group)
#     Windows  serial:COM3                           (Device Manager > Ports shows the number)
#
# If the name is wrong, altairsim lists the serial ports that it can see. Copy the right one.
# The baud rate of the FujiNet (`[Serial] baud=` in its fnconfig.ini, or its web page) must
# match the `baud` below. After you change it on the adapter, turn the adapter off and on.
#
# NO ADAPTER? Run FujiNet-PC (the RS232 build, from the FujiNet firmware releases) with an
# empty `[Serial] port=`. Set `connect` to `socket:localhost:1985`. The steps are
# in the README of the repository above.
#
# THE DISKS. FUJINET.DSK (drive A:) is CP/M 2.2b with the tools. PRN.DSK is drive B:.
# CP/M writes to these disks and there is no undo. Copy an image first if it matters.
#
# THIS FILE CHANGES the `default` machine (`base = "default"`): front panel, 8080, 88-2SIO at
# 10H, 88-DCDD at 08H, 56K of RAM, and the DBL boot PROM at FF00. This file adds the floppies,
# the FujiNet on channel B, and the real 2 MHz crystal.

#> 56K CP/M 2.2b with a FujiNet RS232 on 88-2SIO channel B (port 12H), booting from drive A.
#> You land at the A> prompt. Try FUJIDIR with a TNFS server. FUJIGET, FUJIPUT and WGET
#> print their usage when you type them with no argument.
#>
#> Name the serial device for your computer. See the header of this file.

[machine]
name = "fujinet"
base = "default"

# SHOW SERIAL lists the serial ports of your computer, so you can copy the name of the
# FujiNet port into the `connect` line (see the header). It runs before RUN, because RUN
# hands the keyboard to CP/M.
#
# THE BOOT PROM IS THE BOOT COMMAND. There is no BOOT verb (DESIGN.md 10.0) -- a machine
# that should start says so with the operator's own keystroke, and on a disk Altair that
# keystroke was EXAMINE FF00 / RUN.
#
# DBL reads sectors 0 and 2 of track 0 into RAM. THAT loader pulls the CP/M image into high
# memory and jumps into the BIOS.
#
# RUN hands the GUEST the keyboard, so you land at CP/M's prompt. STOP (^E) gets you back
# to the monitor, and the guest cannot take it from you -- which matters, because ^C
# belongs to CP/M (it is warm boot) and CP/M is entitled to read it.
startup = ["SHOW SERIAL", "RUN FF00"]

# THE BACKSPACE KEY. A modern terminal's Backspace sends DEL (0x7F), and CP/M's line editor
# wants BS (0x08) -- so without this, Backspace at the A> prompt does not erase. `bsdel = bs`
# folds DEL -> BS on the way in (src/host/filter.cpp). It is a property of the TERMINAL, so it
# lives on the [console], not on a line (which stays 8-bit clean, DESIGN.md 7.2).
[console]
bsdel = "bs"

# THE DISK. `id` with NO `type` means "the board already in this machine" -- the base's
# 88-DCDD -- so this puts a floppy in an existing drive rather than fitting a second
# controller.
#
# NO `media` KEY, AND THE REASON IS SHARPER HERE THAN ON THE 8 MB DISK. This image is
# 337,664 bytes and an 8" floppy is 77 x 32 x 137 = 337,568 -- it does NOT match. It is
# XMODEM-padded: the file came off a real machine through a protocol that pads to a block
# boundary, and the 96 bytes on the end are the padding. The board knows that (sizeMatches()
# in src/boards/mits-88dcdd.cpp) and probes it as `8in` anyway. A strict compare would
# reject the only 8" disks we have.
[[board]]
id = "dsk0"

  [[board.drive]]
  unit  = 0
  mount = "FUJINET.DSK"

  [[board.drive]]
  unit  = 1
  mount = "PRN.DSK"

# A GUEST HAS NO CLOCK -- IT COUNTS INSTRUCTIONS. At full speed its timeouts pass in
# microseconds of real time and the tools decide the FujiNet is not answering. A machine that
# talks to real hardware needs the real crystal (docs: "Give the machine its real crystal").
[[board]]
id       = "cpu0"
clock_hz = 2000000

# THE FUJINET, on 88-2SIO channel B (ports 12H status/control, 13H data). `id` with no `type`
# is the 2SIO already in the base machine; channel A stays the console.
[[board]]
id = "sio0"

  [board.unit.b]
  baud    = 76800
# connect = "serial:/dev/cu.usbserial-XXXXXXXX"   # Set this, or use --set. See the header.
